name: Novicap
description: >-
  Novicap is a Spanish working-capital and supply-chain-finance fintech that
  helps companies optimize their circulating capital. Its REST API (base URL
  https://api.novicap.com/v1) lets partners programmatically register suppliers,
  submit and manage invoices, and create payment instructions and adjustments
  across two products: Dynamic Discounting and Confirming Standard (reverse
  factoring). The API uses Bearer API-key authentication with a required
  product_id scope, JSON payloads, and URI-path versioning, and is documented in
  a public developer reference. Novicap is backed by Partech and Techstars.
